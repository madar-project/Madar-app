plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.taqat.madar'
    compileSdk 36

    buildFeatures {
        viewBinding = true
        // يولّد BuildConfig.DEBUG لعرض تفاصيل أخطاء Firebase في التجريب فقط
        buildConfig = true
    }



    defaultConfig {
        applicationId "com.taqat.madar"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // استيراد Firebase BoM لمطابقة الإصدارات تلقائياً
    implementation platform('com.google.firebase:firebase-bom:35.0.2')

// مكتبة المصادقة بالهاتف والايميل (Firebase Authentication)
    implementation 'com.google.firebase:firebase-auth'

// مكتبة قاعدة البيانات (Firestore) إذا كنتِ تستخدمينها
    implementation 'com.google.firebase:firebase-firestore'

// قراءة اتجاه الصورة كما التقطتها الكاميرا، حتى لا تصل مائلة إلى لوحة التحكم
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

// عرض صور المتاجر المرفوعة على Cloudinary، فهي تصل كرابط ولا تُقرأ من الجهاز
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // المكوّنات التلاتة اللي بتيجي تحت Glide (gifdecoder وdisklrucache وannotations)
    // بتوصل لوحدها من هنا، فما تنضافش يدوي: التكرار بيفرض نسخة على بقية المشاريع
}